<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Loop Sort</title>
  </head>
  <body>
    <main id="playable" aria-label="Loop Sort">
      <img class="playable-logo" src="/src/assets/loop-sort-logo.png" alt="" width="600" height="383" />
      <button class="download-cta" type="button" disabled>Download</button>
      <h1 class="win-result" role="status" hidden>Belt cleared!</h1>
      <div class="board">
        <div class="conveyor-hud">
          <p class="game-title" hidden>Clear the belt!</p>
        </div>
      </div>
      <section class="game-over" role="alert" hidden>
        <div class="game-over-content">
          <h1>Belt full!</h1>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
